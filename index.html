<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #eef2ff, transparent 35%),
                  radial-gradient(circle at 80% 0, #fef3c7, transparent 30%),
                  radial-gradient(circle at 50% 80%, #ecfeff, transparent 40%),
                  #0f172a;
    }

    .card {
      width: min(420px, 90vw);
      padding: 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(10px);
    }

    .card h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .card p {
      margin: 0 0 24px;
      color: #475569;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #0f172a;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(120deg, #6366f1, #22d3ee);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 18px 30px rgba(99, 102, 241, 0.3);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(34, 211, 238, 0.35);
    }

    .helper {
      margin-top: 14px;
      text-align: center;
      color: #475569;
      font-size: 14px;
    }

    a {
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Login form">
    <h1>Welcome Back</h1>
    <p>Please sign in to continue.</p>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">Log In</button>
    </form>
    <p class="helper">Forgot your password? <a href="#">Reset it</a></p>
  </main>
</body>
</html>
